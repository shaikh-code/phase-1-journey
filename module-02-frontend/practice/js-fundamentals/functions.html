function outer() {
  let count = 0;        // normally would die when outer() finishes

  return function() {   // but this inner function uses count
    count++;
    return count;
  };
}

// Task 4
function calculator(a, b, operation = "") {

    if (operation === "add") {
        return a + b;

    } else if (operation === "subtract") {
        return a - b;

    } else if (operation === "multiply") {
        return a * b;

    } else if (operation === "divide") {

        if (b === 0) {
            return "Can't divide by zero";
        }

        return a / b;

    } else {
        return "Invalid operation";
    }
}

console.log(calculator(10, 5, "add"));
console.log(calculator(10, 5, "multiply"));
console.log(calculator(10, 0, "divide"));
console.log(calculator(10, 5, "joules"));

function makeWallet(balance){

        deposit:function(amount){
            balance += amount;
            console.log(balance)
        },
        withdraw: function(amount){
            if(amount>balance){
                 console.log("Insufficient balance")
            }else{
                
                balance= balance-amount
                console.log(balance)
            }
        },
        getBalance:function(){
            return balance;
        }
    }
}

wallet.deposit(50);    // logs 150
