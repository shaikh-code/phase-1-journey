<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">

  <main class="app">
    <section class="todo-card">
      <h1>Todo List</h1>
      <p class="subtitle">Plan your tasks. Stay focused.</p>

      <form id="todoForm" class="todo-form">
        <input type="text" id="taskInput" placeholder="Add a task...">
        <button type="submit">Add</button>
        <button style="display: none;" id="cancelBtn" >Cancel</button>
      </form>

      <ul id="taskList" class="task-list"></ul>
    </section>
  </main>
  <footer class="footer">
  <p>
    Designed & Developed by <strong>Shaikh Abdul Moiz</strong>
  </p>

  <p class="footer-info">
    Lahore, Pakistan • Built with Vanilla HTML, CSS & JavaScript
  </p>
</footer>

  <script src="app.js"></script>
</body>
</html>
